<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GeoStamp Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #0b1620;
    --ink-raised: #14242f;
    --hairline:   #243a49;
    --text:       #e8eef2;
    --text-dim:   #8fa6b4;
    --signal:     #ffb32e;
    --lock:       #5fd08a;
    --fault:      #ff7a6b;
    --shutter:    #f2f6f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin-inline: auto;
  }

  .status {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    padding: .85rem 1rem;
    padding-top: calc(.85rem + env(safe-area-inset-top));
    border-bottom: 1px solid var(--hairline);
    background: var(--ink-raised);
    flex: none;
  }

  .beacon {
    width: .55rem;
    height: .55rem;
    border-radius: 50%;
    background: var(--signal);
    flex: none;
    align-self: center;
  }
  .beacon[data-state="searching"] { animation: pulse 1.4s ease-in-out infinite; }
  .beacon[data-state="locked"]    { background: var(--lock); animation: none; }
  .beacon[data-state="fault"]     { background: var(--fault); animation: none; }

  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .beacon { animation: none !important } }

  .fix {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .8rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
    line-height: 1.35;
  }
  .fix-note {
    margin-left: auto;
    font-size: .7rem;
    color: var(--text-dim);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    white-space: nowrap;
  }

  .frame {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video, .shot {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: .65rem .8rem;
    background: rgba(0,0,0,.55);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    font-weight: 600;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .overlay[hidden] { display: none; }

  .fallback {
    padding: 2rem 1.5rem;
    text-align: center;
    color: var(--text-dim);
    font-size: .9rem;
    line-height: 1.6;
  }
  .fallback strong { color: var(--text); display: block; margin-bottom: .4rem; font-weight: 600; }

  .controls {
    flex: none;
    padding: 1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom));
    border-top: 1px solid var(--hairline);
    background: var(--ink-raised);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .9rem;
  }

  .shutter {
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 50%;
    border: 4px solid var(--hairline);
    background: var(--shutter);
    cursor: pointer;
    flex: none;
    transition: transform .08s ease;
  }
  .shutter:active { transform: scale(.93); }
  .shutter:disabled { opacity: .35; cursor: default; }
  .shutter:focus-visible, .btn:focus-visible, .pick:focus-visible {
    outline: 3px solid var(--signal);
    outline-offset: 3px;
  }

  .row { display: flex; gap: .7rem; width: 100%; }

  .btn, .pick {
    flex: 1;
    padding: .85rem 1rem;
    border-radius: .5rem;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-weight: 500;
    font-size: .92rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-primary {
    background: var(--signal);
    border-color: var(--signal);
    color: #1a1204;
    font-weight: 600;
  }

  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .msg {
    font-size: .8rem;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.5;
    min-height: 1.2em;
  }
  .msg[data-tone="fault"] { color: var(--fault); }
</style>
</head>
<body>

<div class="status">
  <span class="beacon" id="beacon" data-state="searching"></span>
  <span class="fix" id="fix">Searching for satellites</span>
  <span class="fix-note" id="fixNote"></span>
</div>

<div class="frame" id="frame">
  <video id="video" playsinline muted autoplay></video>
  <img class="shot" id="shot" alt="Captured photo" hidden>
  <div class="overlay" id="overlay" hidden></div>
</div>

<div class="controls">
  <div id="liveControls">
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
  </div>
  <div class="row" id="resultControls" hidden>
    <button class="btn" id="retake">Take another</button>
    <a class="btn btn-primary" id="save" download="photo.jpg">Save photo</a>
  </div>
  <p class="msg" id="msg"></p>
</div>

<label class="pick" id="pickLabel" hidden>
  Open camera app
  <input type="file" accept="image/*" capture="environment" id="picker">
</label>

<script>
(function () {
  "use strict";

  var video   = document.getElementById("video");
  var shotImg = document.getElementById("shot");
  var overlay = document.getElementById("overlay");
  var beacon  = document.getElementById("beacon");
  var fixEl   = document.getElementById("fix");
  var noteEl  = document.getElementById("fixNote");
  var shutter = document.getElementById("shutter");
  var liveControls   = document.getElementById("liveControls");
  var resultControls = document.getElementById("resultControls");
  var retake  = document.getElementById("retake");
  var saveLink = document.getElementById("save");
  var msg     = document.getElementById("msg");
  var picker  = document.getElementById("picker");
  var pickLabel = document.getElementById("pickLabel");
  var frame   = document.getElementById("frame");

  var fix = null;
  var clockTimer = null;
  var objectUrl = null;

  function coord(value, isLat) {
    var hemi = isLat ? (value >= 0 ? "N" : "S") : (value >= 0 ? "E" : "W");
    return Math.abs(value).toFixed(6) + "\u00B0" + hemi;
  }

  function stampLines() {
    var now = new Date();
    var when = now.toLocaleString(undefined, {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hour12: false
    });
    var tz = (now.toTimeString().match(/\(([^)]+)\)/) || [, ""])[1];
    return [
      fix ? coord(fix.lat, true) + "   " + coord(fix.lon, false)
          : "Location unavailable",
      when + (tz ? "  " + tz : "")
    ];
  }

  function paintOverlay() {
    var lines = stampLines();
    overlay.textContent = "";
    lines.forEach(function (line) {
      var div = document.createElement("div");
      div.textContent = line;
      overlay.appendChild(div);
    });
  }

  function startLocation() {
    if (!navigator.geolocation) {
      beacon.dataset.state = "fault";
      fixEl.textContent = "This device has no location support";
      return;
    }
    navigator.geolocation.watchPosition(function (pos) {
      fix = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };
      beacon.dataset.state = "locked";
      fixEl.textContent = coord(fix.lat, true) + "  " + coord(fix.lon, false);
      noteEl.textContent = "\u00B1" + Math.round(fix.accuracy) + " m";
    }, function (err) {
      beacon.dataset.state = "fault";
      noteEl.textContent = "";
      fixEl.textContent = err.code === 1
        ? "Location blocked \u2014 allow it for this app"
        : "No fix yet \u2014 step outdoors";
    }, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 20000
    });
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      useFilePicker("Live preview is not available here.");
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }).then(function (stream) {
      video.srcObject = stream;
      overlay.hidden = false;
      paintOverlay();
      clockTimer = setInterval(paintOverlay, 1000);
    }).catch(function () {
      useFilePicker("Camera access is blocked here.");
    });
  }

  function useFilePicker(reason) {
    video.hidden = true;
    liveControls.hidden = true;
    frame.innerHTML = "";
    var box = document.createElement("div");
    box.className = "fallback";
    var strong = document.createElement("strong");
    strong.textContent = reason;
    var p = document.createElement("span");
    p.textContent = "Use the phone's camera instead \u2014 the photo comes back here and gets stamped the same way.";
    box.appendChild(strong);
    box.appendChild(p);
    frame.appendChild(box);
    pickLabel.hidden = false;
    liveControls.appendChild(pickLabel);
    liveControls.hidden = false;
  }

  function stamp(source, width, height) {
    var canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(source, 0, 0, width, height);

    var lines = stampLines();
    var size  = Math.round(width * 0.032);
    var pad   = Math.round(width * 0.025);
    var gap   = Math.round(size * 0.35);
    var block = lines.length * size + (lines.length - 1) * gap + pad * 2;

    ctx.fillStyle = "rgba(0,0,0,0.58)";
    ctx.fillRect(0, height - block, width, block);

    ctx.fillStyle = "#ffffff";
    ctx.font = "600 " + size + "px 'IBM Plex Mono', monospace";
    ctx.textBaseline = "alphabetic";

    var y = height - block + pad + size;
    lines.forEach(function (line) {
      ctx.fillText(line, pad, y);
      y += size + gap;
    });

    return new Promise(function (resolve) {
      canvas.toBlob(resolve, "image/jpeg", 0.95);
    });
  }

  function fileName() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    return "GEO_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
         + "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".jpg";
  }

  function showResult(made) {
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    if (objectUrl) { URL.revokeObjectURL(objectUrl); }
    objectUrl = URL.createObjectURL(made);

    shotImg.src = objectUrl;
    shotImg.hidden = false;
    video.hidden = true;
    overlay.hidden = true;
    liveControls.hidden = true;
    resultControls.hidden = false;

    saveLink.href = objectUrl;
    saveLink.download = fileName();

    setMsg("Tap Save photo, or press and hold the image to save it to your gallery.");
  }

  function setMsg(text, tone) {
    msg.textContent = text || "";
    if (tone) { msg.dataset.tone = tone; } else { delete msg.dataset.tone; }
  }

  shutter.addEventListener("click", function () {
    if (!video.videoWidth) { return; }
    shutter.disabled = true;
    stamp(video, video.videoWidth, video.videoHeight).then(function (made) {
      shutter.disabled = false;
      if (made) { showResult(made); }
    });
  });

  picker.addEventListener("change", function () {
    var file = picker.files && picker.files[0];
    if (!file) { return; }
    setMsg("Stamping\u2026");
    var loader = window.createImageBitmap
      ? createImageBitmap(file, { imageOrientation: "from-image" })
      : new Promise(function (resolve, reject) {
          var img = new Image();
          img.onload = function () { resolve(img); };
          img.onerror = reject;
          img.src = URL.createObjectURL(file);
        });

    loader.then(function (bmp) {
      var w = bmp.width || bmp.naturalWidth;
      var h = bmp.height || bmp.naturalHeight;
      return stamp(bmp, w, h);
    }).then(function (made) {
      if (made) { showResult(made); }
    }).catch(function () {
      setMsg("That image could not be read. Try another.", "fault");
    });
    picker.value = "";
  });

  retake.addEventListener("click", function () {
    shotImg.hidden = true;
    resultControls.hidden = true;
    setMsg("");
    if (video.srcObject) {
      video.hidden = false;
      overlay.hidden = false;
      liveControls.hidden = false;
      paintOverlay();
      clockTimer = setInterval(paintOverlay, 1000);
    } else {
      liveControls.hidden = false;
      picker.click();
    }
  });

  startLocation();
  startCamera();
})();
</script>

</body>
</html>
